[package]
name = "transferbuddy-desktop"
version.workspace = true
edition = "2021"
license = "MIT"

[dependencies]
transferbuddy-core = { path = "../core" }
eframe = { version = "0.35.0", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
wgpu = { version = "29", features = ["metal", "vulkan", "dx12"] }
egui_extras = "0.35.0"
rfd = "0.17"
tray-icon = "0.26"
muda = "0.21"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-service-management = "0.3"
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
transferbuddy-core = { path = "../core", features = ["test-support"] }
egui_kittest = {version="0.35.0",features=["eframe","wgpu","snapshot"]}
