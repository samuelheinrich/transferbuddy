[package]
name = "transferbuddy"
version = "0.2.2"
edition = "2021"
description = "Multi-protocol file transfer server for provisioning Cisco network devices (FTP/HTTP/HTTPS/SCP/SFTP/TFTP) with a keyboard-driven TUI"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# TUI
ratatui = "0.29"
crossterm = "0.28"
# TLS / certificates
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"
# SSH (SFTP + SCP)
russh = "0.46"
russh-keys = "0.46"
russh-sftp = "2"
# Config
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Utilities
dirs = "5"
if-addrs = "0.13"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
md-5 = "0.10"
anyhow = "1"
async-trait = "0.1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
opt-level = 3

[dev-dependencies.libc]
version = "0.2"
