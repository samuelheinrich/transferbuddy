[package]
name = "transferbuddy"
version.workspace = true
edition = "2021"
description = "Multi-protocol file transfer server for provisioning Cisco network devices (FTP/HTTP/HTTPS/SCP/SFTP/TFTP) with a keyboard-driven TUI"
license = "MIT"

[dependencies]
transferbuddy-core = { path = "crates/core" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
anyhow = "1"
libc = "0.2"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
transferbuddy-core = { path = "crates/core", features = ["test-support"] }

[profile.release]
lto = true
strip = true
opt-level = 3

[dev-dependencies.libc]
version = "0.2"

[workspace]
members = ["crates/core", "crates/desktop", "crates/port-helper"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.2.14"
